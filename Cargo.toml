[workspace]
resolver = "3"
members = ["crates/redes-core", "crates/redes-cli", "crates/redes-app"]
# El checkout de Rune y los spikes son mundos aparte: cada uno tiene su propio workspace.
exclude = ["vendor/rune", "spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
redes-core = { path = "crates/redes-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Rune se consume del checkout vendorizado y fijado (ver docs/00-investigacion-rune.md).
# Un `[patch]` de una dependencia no aplica al workspace que la consume: toda app que
# compile Rune repite los parches de Rune.
[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
accesskit_windows = { path = "vendor/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "vendor/rune/vendor/accesskit_macos" }

# F14-09. Release: LTO fina y una sola unidad de código (binario más rápido en el banco, a cambio
# de compilar más despacio). Dev: las dependencias (Rune, wgpu, serde…) optimizadas para que la app
# y las pruebas sean usables; los crates del workspace siguen en opt-level 0 (compilación rápida).
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
